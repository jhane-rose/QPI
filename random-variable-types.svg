<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title description">
  <title id="title">Discrete counts and continuous measurements</title>
  <desc id="description">A side-by-side comparison: countable books form a discrete variable and a measuring ruler represents a continuous variable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="cont" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#334155" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="880" height="420" rx="30" fill="url(#bg)"/>
  <text x="450" y="62" text-anchor="middle" fill="#312e81" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">COUNT IT OR MEASURE IT?</text>
  <text x="450" y="91" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="16">That tells you which type of random variable you have</text>

  <g filter="url(#shadow)">
    <rect x="48" y="120" width="386" height="266" rx="24" fill="#fff"/>
    <rect x="466" y="120" width="386" height="266" rx="24" fill="#fff"/>
  </g>
  <rect x="70" y="140" width="342" height="48" rx="15" fill="#ede9fe"/>
  <text x="241" y="172" text-anchor="middle" fill="#5b21b6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">DISCRETE = COUNT</text>
  <rect x="488" y="140" width="342" height="48" rx="15" fill="#ccfbf1"/>
  <text x="659" y="172" text-anchor="middle" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CONTINUOUS = MEASURE</text>

  <g filter="url(#shadow)">
    <rect x="132" y="220" width="54" height="104" rx="9" fill="url(#disc)"/>
    <rect x="194" y="202" width="54" height="122" rx="9" fill="#7c3aed"/>
    <rect x="256" y="229" width="54" height="95" rx="9" fill="#a78bfa"/>
    <rect x="318" y="211" width="54" height="113" rx="9" fill="#6d28d9"/>
  </g>
  <path d="M150 245h18M150 258h18M212 229h18M212 242h18M274 253h18M274 266h18M336 238h18M336 251h18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="252" y="354" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Books, messages, students</text>

  <rect x="530" y="250" width="258" height="28" rx="14" fill="url(#cont)"/>
  <path d="M558 250v18M586 250v10M614 250v18M642 250v10M670 250v18M698 250v10M726 250v18M754 250v10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="665" cy="236" r="13" fill="#f97316" stroke="#fff" stroke-width="4"/>
  <path d="M665 236v-32M665 204l-9 12M665 204l9 12" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="659" y="320" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="16">Height, weight, time, distance</text>
  <text x="659" y="350" text-anchor="middle" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">May include decimal values</text>

  <circle cx="241" cy="409" r="5" fill="#8b5cf6"/>
  <circle cx="659" cy="409" r="5" fill="#14b8a6"/>
</svg>
