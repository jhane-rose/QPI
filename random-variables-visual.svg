<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title description">
  <title id="title">Random variables, discrete and continuous</title>
  <desc id="description">Coin-toss outcomes map to a random variable counting heads, with discrete counts and continuous measurements shown below.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312e81" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="940" height="540" rx="34" fill="url(#background)"/>
  <circle cx="880" cy="72" r="44" fill="#ddd6fe" opacity=".55"/>
  <circle cx="76" cy="478" r="54" fill="#bae6fd" opacity=".45"/>

  <text x="480" y="61" text-anchor="middle" fill="#312e81" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">FROM CHANCE TO NUMBER</text>
  <text x="480" y="91" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="17">A random variable assigns a value to each outcome</text>

  <g filter="url(#shadow)">
    <rect x="47" y="125" width="360" height="214" rx="24" fill="#fff"/>
    <rect x="553" y="125" width="360" height="214" rx="24" fill="#fff"/>
  </g>
  <text x="227" y="162" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">TOSS TWO COINS</text>
  <text x="733" y="162" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">LET X = NUMBER OF HEADS</text>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">
    <g>
      <circle cx="118" cy="223" r="37" fill="#fef3c7" stroke="#f59e0b" stroke-width="4"/>
      <text x="118" y="231" fill="#92400e" font-size="22">HH</text>
      <circle cx="227" cy="223" r="37" fill="#ede9fe" stroke="#8b5cf6" stroke-width="4"/>
      <text x="227" y="231" fill="#5b21b6" font-size="22">HT</text>
      <circle cx="336" cy="223" r="37" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
      <text x="336" y="231" fill="#1e40af" font-size="22">TH</text>
      <circle cx="227" cy="300" r="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
      <text x="227" y="307" fill="#334155" font-size="19">TT</text>
    </g>
    <g>
      <rect x="587" y="190" width="74" height="68" rx="17" fill="#fef3c7"/>
      <text x="624" y="233" fill="#92400e" font-size="29">2</text>
      <rect x="686" y="190" width="74" height="68" rx="17" fill="#ede9fe"/>
      <text x="723" y="233" fill="#5b21b6" font-size="29">1</text>
      <rect x="785" y="190" width="74" height="68" rx="17" fill="#dbeafe"/>
      <text x="822" y="233" fill="#1e40af" font-size="29">1</text>
      <rect x="686" y="272" width="74" height="54" rx="15" fill="#e2e8f0"/>
      <text x="723" y="309" fill="#334155" font-size="26">0</text>
    </g>
  </g>
  <path d="M414 229h119" stroke="#818cf8" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="480" y="211" text-anchor="middle" fill="#6366f1" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">MAP</text>

  <g filter="url(#shadow)">
    <rect x="47" y="371" width="414" height="139" rx="24" fill="#fff"/>
    <rect x="499" y="371" width="414" height="139" rx="24" fill="#fff"/>
  </g>
  <circle cx="103" cy="425" r="24" fill="url(#purple)"/>
  <text x="103" y="433" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">#</text>
  <text x="143" y="416" fill="#4c1d95" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">DISCRETE</text>
  <text x="143" y="445" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="17">Countable values: 0, 1, 2, ...</text>
  <text x="143" y="477" fill="#7c3aed" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Count it → discrete</text>

  <circle cx="555" cy="425" r="24" fill="url(#teal)"/>
  <path d="M541 428c8-20 17 20 28 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <text x="595" y="416" fill="#115e59" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">CONTINUOUS</text>
  <text x="595" y="445" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="17">Measured values: height, time, weight</text>
  <text x="595" y="477" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Measure it → continuous</text>
</svg>
